<!DOCTYPE html>
<!--
  starter-scene.html — a complete, runnable, tier-adaptive Three.js r185 scene.

  What it demonstrates, all wired together correctly:
    - WebGPURenderer with automatic WebGL2 fallback (?webgl=1 forces the fallback)
    - device tier detection with quality presets and a ?quality= override
    - GLTFLoader with Draco, KTX2 and Meshopt configured
    - a procedural placeholder object so it runs with no assets at all
    - HDRI-equivalent environment lighting via RoomEnvironment (zero download)
    - three-point lighting, correct color management, ACES tone mapping
    - AnimationMixer for glTF clips, plus idle motion and mouse parallax
    - on-demand rendering, dynamic resolution scaling, disposal
    - honest loading progress and a no-WebGL fallback

  Run it:  npx serve .    then open the printed URL. Modules need a real server.

  Adapt it:
    1. set MODEL_URL to your optimized GLB (see scripts/optimize-glb.ps1)
    2. drop the decoder files into /draco and /basis (scripts/fetch-decoders.mjs)
    3. replace createPlaceholder() with your own content, or delete it
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three.js adaptive scene</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e9ecf1;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }

  #loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    background: #0b0d10; transition: opacity .5s ease; z-index: 10; }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #bar { width: 220px; height: 2px; background: #23272e; overflow: hidden; border-radius: 2px; }
  #fill { height: 100%; width: 0%; background: #6ea8fe; transition: width .2s ease; }
  #loader p { margin: 0; text-align: center; color: #8b929c; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; }

  #hud { position: fixed; top: 12px; left: 12px; z-index: 5;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7e858f; }
  #hud b { color: #b9c0ca; font-weight: 500; }

  #fallback { position: fixed; inset: 0; display: none; place-content: center;
    text-align: center; padding: 24px; z-index: 20; background: #0b0d10; }
  #fallback.show { display: grid; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="loader">
  <div id="bar"><div id="fill"></div></div>
  <p id="status">loading</p>
</div>

<div id="hud"></div>

<div id="fallback">
  <div>
    <h1 style="font-size:18px;margin:0 0 8px">3D isn't available on this device</h1>
    <p style="color:#8b929c;margin:0">Your browser doesn't support WebGL or WebGPU.</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/webgpu":  "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/tsl":     "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }      from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader }       from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder }   from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';

// ─────────────────────────────────────────────────────────────────────────────
// config
// ─────────────────────────────────────────────────────────────────────────────

const MODEL_URL = null;   // e.g. '/models/hero.glb' — null renders the procedural placeholder
const THREE_VERSION = '0.185.1';
const CDN = `https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/examples/jsm/libs`;

const params = new URLSearchParams(location.search);
const FORCE_WEBGL = params.has('webgl');

const PRESETS = {
  desktop: { dpr: 2, shadows: true,  shadowMapSize: 2048, post: true,  anisotropy: 8,
             modelSuffix: '',    segments: 128, particleCount: 6000 },
  tablet:  { dpr: 2, shadows: true,  shadowMapSize: 1024, post: false, anisotropy: 4,
             modelSuffix: '.md', segments: 96,  particleCount: 3000 },
  mobile:  { dpr: 1, shadows: false, shadowMapSize: 512,  post: false, anisotropy: 1,
             modelSuffix: '.lo', segments: 64,  particleCount: 1200 },
};

function detectTier() {
  const override = params.get('quality');
  if (override && PRESETS[override]) return override;

  const ua = navigator.userAgent;
  const uaMobile = navigator.userAgentData?.mobile ?? /Android|iPhone|iPod|Mobile/i.test(ua);
  const isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const coarse = matchMedia('(pointer: coarse)').matches;
  const mem = navigator.deviceMemory ?? 4;
  const cores = navigator.hardwareConcurrency ?? 4;
  const shortSide = Math.min(screen.width, screen.height);

  if (navigator.connection?.saveData) return 'mobile';
  if (uaMobile && !isTablet) return 'mobile';
  if (isTablet || (coarse && shortSide >= 700)) return 'tablet';
  if (mem <= 4 || cores <= 4) return 'tablet';
  return 'desktop';
}

const tier = detectTier();
const preset = PRESETS[tier];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ui = {
  loader: document.getElementById('loader'),
  fill: document.getElementById('fill'),
  status: document.getElementById('status'),
  hud: document.getElementById('hud'),
  stage: document.getElementById('stage'),
};

// ─────────────────────────────────────────────────────────────────────────────
// renderer
// ─────────────────────────────────────────────────────────────────────────────

let renderer;
try {
  renderer = new THREE.WebGPURenderer({
    antialias: tier !== 'mobile',
    alpha: false,
    powerPreference: 'high-performance',
    forceWebGL: FORCE_WEBGL,
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, preset.dpr));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = preset.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  ui.stage.appendChild(renderer.domElement);
  await renderer.init();                       // required before any manual render
} catch (err) {
  console.error(err);
  document.getElementById('fallback').classList.add('show');
  ui.loader.classList.add('hidden');
  throw err;
}

const backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';

// ─────────────────────────────────────────────────────────────────────────────
// scene, camera, controls
// ─────────────────────────────────────────────────────────────────────────────

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0d10, 12, 40);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.6, 1.8, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.75, 0);
controls.minDistance = 2.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.enablePan = !matchMedia('(pointer: coarse)').matches;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.4;

// ─────────────────────────────────────────────────────────────────────────────
// lighting — environment first, then a three-point rig
// ─────────────────────────────────────────────────────────────────────────────

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
// swap in a real HDRI on desktop for a stronger look:
//   const hdr = await new RGBELoader().loadAsync('/hdr/studio_2k.hdr');
//   hdr.mapping = THREE.EquirectangularReflectionMapping;
//   scene.environment = pmrem.fromEquirectangular(hdr).texture; hdr.dispose();

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(4, 6.5, 4);
key.castShadow = preset.shadows;
if (preset.shadows) {
  key.shadow.mapSize.setScalar(preset.shadowMapSize);
  key.shadow.bias = -0.0005;
  key.shadow.normalBias = 0.02;
  key.shadow.radius = 4;
  const d = 5;
  Object.assign(key.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 0.5, far: 24 });
  key.shadow.camera.updateProjectionMatrix();
}

const fill = new THREE.DirectionalLight(0xbcd4ff, 0.7);
fill.position.set(-5, 2.5, 3.5);

const rim = new THREE.DirectionalLight(0xffe6c4, 2.2);
rim.position.set(-2.5, 4, -6);

scene.add(key, fill, rim);

// ground — a shadow catcher, or a soft baked disc on mobile
if (preset.shadows) {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.ShadowMaterial({ opacity: 0.32 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
} else {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d').createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,.45)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  const ctx = c.getContext('2d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 3.6),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.002;
  scene.add(blob);
}

// ─────────────────────────────────────────────────────────────────────────────
// content
// ─────────────────────────────────────────────────────────────────────────────

const subject = new THREE.Group();
scene.add(subject);

let mixer = null;
const disposables = [];

function createPlaceholder() {
  const group = new THREE.Group();
  const seg = preset.segments;

  const body = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.85, tier === 'mobile' ? 2 : 4),
    new THREE.MeshPhysicalMaterial({
      color: 0x2f6fd0, metalness: 0.85, roughness: 0.22,
      clearcoat: 1, clearcoatRoughness: 0.08,
    })
  );
  body.position.y = 0.95;
  body.castShadow = preset.shadows;
  group.add(body);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.35, 0.022, 12, Math.max(64, seg)),
    new THREE.MeshStandardMaterial({ color: 0xffb457, emissive: 0xff8a1f,
      emissiveIntensity: 1.6, roughness: 0.4, metalness: 0.6 })
  );
  ring.rotation.x = Math.PI * 0.46;
  ring.position.y = 0.95;
  group.add(ring);

  // instanced motes — one draw call regardless of count
  const count = preset.particleCount;
  const motes = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.012, 6, 4),
    new THREE.MeshBasicMaterial({ color: 0x9fc4ff }),
    count
  );
  const m = new THREE.Matrix4();
  for (let i = 0; i < count; i++) {
    const r = 1.6 + Math.random() * 4;
    const a = Math.random() * Math.PI * 2;
    m.setPosition(Math.cos(a) * r, Math.random() * 3.4, Math.sin(a) * r);
    motes.setMatrixAt(i, m);
  }
  motes.instanceMatrix.needsUpdate = true;
  group.add(motes);

  disposables.push(body.geometry, body.material, ring.geometry, ring.material,
                   motes.geometry, motes.material);
  return group;
}

function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  object.position.sub(center);
  object.position.y += size.y / 2;

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = (maxDim / 2 / Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.9;
  camera.position.set(dist * 0.55, size.y * 0.85, dist);
  camera.near = dist / 100;
  camera.far = dist * 60;
  camera.updateProjectionMatrix();
  controls.target.set(0, size.y * 0.5, 0);
  controls.minDistance = dist * 0.4;
  controls.maxDistance = dist * 3;
  controls.update();
}

async function loadContent() {
  if (!MODEL_URL) {
    ui.status.textContent = 'building scene';
    subject.add(createPlaceholder());
    return;
  }

  const manager = new THREE.LoadingManager();
  manager.onProgress = (_url, loaded, total) => {
    ui.fill.style.width = `${Math.round((loaded / total) * 100)}%`;
  };

  const draco = new DRACOLoader(manager).setDecoderPath(`${CDN}/draco/`);
  const ktx2 = new KTX2Loader(manager).setTranscoderPath(`${CDN}/basis/`).detectSupport(renderer);

  const loader = new GLTFLoader(manager)
    .setDRACOLoader(draco)
    .setKTX2Loader(ktx2)
    .setMeshoptDecoder(MeshoptDecoder);

  const url = MODEL_URL.replace(/\.glb$/, `${preset.modelSuffix}.glb`);
  ui.status.textContent = 'loading model';

  const gltf = await loader.loadAsync(url);

  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = preset.shadows;
    o.receiveShadow = preset.shadows;
    for (const mat of (Array.isArray(o.material) ? o.material : [o.material])) {
      if (mat.map) mat.map.anisotropy = preset.anisotropy;
      if (tier === 'mobile' && mat.transmission > 0) {
        mat.transmission = 0; mat.transparent = true; mat.opacity = 0.45;
        mat.roughness = 0.1; mat.needsUpdate = true;
      }
    }
  });

  subject.add(gltf.scene);
  frameObject(gltf.scene);

  if (gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(gltf.scene);
    mixer.clipAction(gltf.animations[0]).play();
  }

  draco.dispose();
  ktx2.dispose();
}

// ─────────────────────────────────────────────────────────────────────────────
// interaction: mouse parallax
// ─────────────────────────────────────────────────────────────────────────────

const pointer = new THREE.Vector2();
const parallax = new THREE.Vector2();
if (!reduceMotion) {
  addEventListener('pointermove', (e) => {
    pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  }, { passive: true });
}

// ─────────────────────────────────────────────────────────────────────────────
// loop: on-demand rendering + dynamic resolution
// ─────────────────────────────────────────────────────────────────────────────

const clock = new THREE.Clock();
let needsRender = true;
let running = true;
let resScale = 1;
let frames = 0, accum = 0, cooldown = 0, fps = 0;

const invalidate = () => { needsRender = true; };
controls.addEventListener('change', invalidate);

function updateResolution(dt) {
  accum += dt; frames++; cooldown -= dt;
  if (accum < 1) return;
  fps = Math.round(frames / accum);
  accum = 0; frames = 0;
  if (cooldown > 0) return;

  const base = Math.min(devicePixelRatio, preset.dpr);
  if (fps < 45 && resScale > 0.55) resScale = Math.max(0.55, resScale - 0.1);
  else if (fps > 58 && resScale < 1) resScale = Math.min(1, resScale + 0.05);
  else return;

  renderer.setPixelRatio(base * resScale);
  cooldown = 1.5;
  invalidate();
}

const baseSubjectY = subject.position.y;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  updateResolution(dt);

  if (mixer) { mixer.update(dt); needsRender = true; }

  if (!reduceMotion) {
    const t = clock.elapsedTime;
    subject.position.y = baseSubjectY + Math.sin(t * 1.1) * 0.03;
    subject.rotation.y += dt * 0.08;
    parallax.lerp(pointer, 1 - Math.exp(-3 * dt));
    controls.target.x = parallax.x * 0.12;
    controls.target.y = 0.75 + parallax.y * 0.08;
    needsRender = true;
  }

  if (controls.update()) needsRender = true;
  if (!needsRender) return;
  needsRender = false;

  renderer.render(scene, camera);
  ui.hud.innerHTML =
    `<b>${tier}</b> · ${backend} · ${fps} fps<br>` +
    `calls <b>${renderer.info.render.calls}</b> · ` +
    `tris <b>${renderer.info.render.triangles.toLocaleString()}</b> · ` +
    `dpr <b>${(Math.min(devicePixelRatio, preset.dpr) * resScale).toFixed(2)}</b>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// resize / visibility
// ─────────────────────────────────────────────────────────────────────────────

let resizeRaf = 0;
function onResize() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, preset.dpr) * resScale);
    invalidate();
  });
}
new ResizeObserver(onResize).observe(document.body);
addEventListener('orientationchange', () => setTimeout(onResize, 250));

document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) { clock.getDelta(); renderer.setAnimationLoop(tick); }
  else renderer.setAnimationLoop(null);
});

// ─────────────────────────────────────────────────────────────────────────────
// teardown — call before removing the canvas or navigating away in an SPA
// ─────────────────────────────────────────────────────────────────────────────

function teardown() {
  renderer.setAnimationLoop(null);
  mixer?.stopAllAction();
  scene.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
        for (const k of Object.keys(m)) if (m[k]?.isTexture) m[k].dispose();
        m.dispose();
      }
    }
  });
  for (const d of disposables) d.dispose?.();
  scene.environment?.dispose();
  pmrem.dispose();
  controls.dispose();
  renderer.dispose();
  renderer.domElement.remove();
}
window.teardownScene = teardown;   // exposed for manual testing

// ─────────────────────────────────────────────────────────────────────────────
// boot
// ─────────────────────────────────────────────────────────────────────────────

try {
  await loadContent();
  await renderer.compileAsync?.(scene, camera);   // avoids first-frame shader hitching
} catch (err) {
  console.error(err);
  ui.status.textContent = 'failed to load — see console';
}

ui.fill.style.width = '100%';
ui.loader.classList.add('hidden');
renderer.setAnimationLoop(tick);

console.log(`tier=${tier} backend=${backend} — try ?quality=mobile or ?webgl=1`);
</script>
</body>
</html>
